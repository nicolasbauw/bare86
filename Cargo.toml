[package]
name = "bare86"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Runs DOS programs on Linux at native speed with KVM: no x86 emulation, BIOS, DOS and PC hardware (VGA/SVGA, Sound Blaster, Gravis UltraSound, Glide, OpenGL) in software"
repository = "https://github.com/nicolasbauw/bare86"
readme = "README.md"
keywords = ["dos", "kvm", "emulator", "retro", "demoscene"]
categories = ["emulators"]
# Fichiers du paquet : liste explicite (les fichiers de travail non suivis
# du dépôt n'y entrent pas).
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**",
    "/asm/**",
    "/c/**",
    "/guest/**",
    "/fonts/**",
    "/third_party/**",
    "/tools/*.py",
    "/tools/*.sh",
    "/docs/**",
]

[dependencies]
flate2 = "1.1.11"
glow = "0.17.0"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info", "intel", "encoder", "block_encoder", "code_asm"] }
kvm-bindings = "0.14.2"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
kvm-ioctls = "0.25.1"
libc = "0.2.191"
sha2 = "0.10.9"
perf-event-open-sys = "7.1.0"
sdl3 = "0.22.1"

[build-dependencies]
cc = "1"
